<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Awesome Produce Supply Chain — curated list of produce supply chain software platforms">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b5e20">
        <animate attributeName="stop-color" values="#1b5e20;#2e7d32;#388e3c;#1b5e20" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#2e7d32">
        <animate attributeName="stop-color" values="#2e7d32;#388e3c;#43a047;#2e7d32" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00695c">
        <animate attributeName="stop-color" values="#00695c;#00796b;#00897b;#00695c" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(255,255,255,0)" />
      <stop offset="50%" stop-color="rgba(255,255,255,0.18)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="2 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="100%" stop-color="#f9a825"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="320" fill="url(#bgGrad)" rx="24"/>
  <rect x="0" y="0" width="1200" height="320" fill="url(#shine)" rx="24"/>

  <!-- Sun -->
  <circle cx="1080" cy="72" r="46" fill="url(#sun)">
    <animate attributeName="r" values="46;50;46" dur="6s" repeatCount="indefinite"/>
  </circle>
  <g stroke="#fff59d" stroke-width="3" stroke-linecap="round" opacity="0.7">
    <line x1="1080" y1="8" x2="1080" y2="20"/>
    <line x1="1080" y1="124" x2="1080" y2="136"/>
    <line x1="1016" y1="72" x2="1028" y2="72"/>
    <line x1="1132" y1="72" x2="1144" y2="72"/>
    <line x1="1035" y1="27" x2="1043" y2="35"/>
    <line x1="1117" y1="109" x2="1125" y2="117"/>
    <line x1="1117" y1="27" x2="1125" y2="35"/>
    <line x1="1035" y1="117" x2="1043" y2="109"/>
  </g>

  <!-- Rolling hills -->
  <path d="M0 320 Q 150 240 320 300 T 640 290 T 960 305 T 1200 280 L 1200 320 Z" fill="#43a047" opacity="0.55">
    <animate attributeName="d" values="M0 320 Q 150 240 320 300 T 640 290 T 960 305 T 1200 280 L 1200 320 Z;M0 320 Q 150 260 320 295 T 640 310 T 960 285 T 1200 300 L 1200 320 Z;M0 320 Q 150 240 320 300 T 640 290 T 960 305 T 1200 280 L 1200 320 Z" dur="10s" repeatCount="indefinite"/>
  </path>
  <path d="M0 320 Q 200 285 400 315 T 800 300 T 1200 310 L 1200 320 Z" fill="#2e7d32" opacity="0.65">
    <animate attributeName="d" values="M0 320 Q 200 285 400 315 T 800 300 T 1200 310 L 1200 320 Z;M0 320 Q 200 305 400 300 T 800 320 T 1200 295 L 1200 320 Z;M0 320 Q 200 285 400 315 T 800 300 T 1200 310 L 1200 320 Z" dur="12s" repeatCount="indefinite"/>
  </path>

  <!-- Produce: tomato, apple, carrot, leaf -->
  <g transform="translate(120 210)">
    <circle r="26" fill="#e53935">
      <animate attributeName="cy" values="0;-6;0" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M-4 -26 Q 0 -34 4 -26" stroke="#2e7d32" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(190 200)">
    <circle r="22" fill="#f44336">
      <animate attributeName="cy" values="0;-8;0" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M-3 -22 Q 0 -29 3 -22" stroke="#2e7d32" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(1030 220)">
    <circle r="20" fill="#fdd835">
      <animate attributeName="cy" values="0;7;0" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1100 225)" fill="#66bb6a">
    <path d="M0 -18 C 14 -14 18 -2 16 8 C 6 6 -6 8 -12 2 C -14 -8 -8 -16 0 -18 Z">
      <animateTransform attributeName="transform" type="rotate" values="0 0 0;10 0 0;0 0 0" dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Text -->
  <text x="60" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff" filter="url(#softShadow)">
    <tspan>Awesome Produce Supply Chain</tspan>
  </text>
  <text x="60" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#c8e6c9" letter-spacing="1">
    🥬 A curated list of produce supply chain software platforms 🍅
    <animate attributeName="opacity" values="1;0.6;1" dur="3s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#e8f5e9" opacity="0.92">
    ERP · Traceability · Inventory · Farm Management · Financing · Open-Source &amp; SaaS
  </text>

  <!-- Animated counter-ish dots -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#a5d6a7">
    <text x="60" y="270" opacity="0.85">🌱 Farm →</text>
    <text x="180" y="270" opacity="0.85">🚚 Distribution →</text>
    <text x="340" y="270" opacity="0.85">🛒 Retail →</text>
    <text x="460" y="270" opacity="0.85">🍽️ Consumer</text>
    <circle cx="310" cy="266" r="3" fill="#fff59d"><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="430" cy="266" r="3" fill="#fff59d"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="266" r="3" fill="#fff59d"><animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
